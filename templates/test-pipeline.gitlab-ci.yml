include:
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - build
  - security
  - code_quality
  - analyze
  - deploy

default:
  tags:
    - amd64

build:
  stage: build
  image: node:18-alpine
  script:
    - echo "Building application..."
    - npm ci || echo "No package.json found"
    - npm run build || echo "No build script found"
  artifacts:
    paths:
      - dist/
      - build/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

semgrep-sast:
  script:
    - /analyzer run
    - mv gl-sast-report.json semgrep-sast-report.json
  artifacts:
    paths:
      - semgrep-sast-report.json
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

secret_detection:
  script:
    - /analyzer run
    - mv gl-secret-detection-report.json secret-detection-report.json
  artifacts:
    paths:
      - secret-detection-report.json
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

code_quality:
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

analyze_reports:
  stage: analyze
  image: alpine:latest
  before_script:
    - apk add --no-cache jq bash
  script:
    - bash ./scripts/analyze_reports.sh
  dependencies:
    - semgrep-sast
    - secret_detection
  artifacts:
    paths:
      - security-analysis-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deployment would happen here"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  when: manual
