# Complete Pipeline Template for Test Projects
# This file should be in your GitHub repository: templates/test-pipeline.gitlab-ci.yml
# GitLab projects include this via: 
#   include:
#     - remote: 'https://raw.githubusercontent.com/USER/REPO/main/templates/test-pipeline.gitlab-ci.yml'

# Include GitLab's built-in security and quality templates
include:
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Define pipeline stages
stages:
  - build
  - security
  - code_quality
  - analyze
  - deploy

# Default configuration for all jobs
default:
  tags:
    - amd64

# ============================================
# BUILD STAGE
# ============================================

build:
  stage: build
  image: node:18-alpine
  script:
    - echo "Building application..."
    - npm ci || echo "No package.json found, skipping npm install"
    - npm run build || echo "No build script found"
    - echo "Build completed successfully!"
  artifacts:
    paths:
      - dist/
      - build/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================
# SECURITY STAGE (Using GitLab Templates)
# ============================================

# SAST (Static Application Security Testing)
# Customize the job from GitLab's template
semgrep-sast:
  stage: security
  script:
    - /analyzer run
    - mv gl-sast-report.json semgrep-sast-report.json
  artifacts:
    paths:
      - semgrep-sast-report.json
    reports:
      sast: semgrep-sast-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Secret Detection
# Customize the job from GitLab's template
secret_detection:
  stage: security
  script:
    - /analyzer run
    - mv gl-secret-detection-report.json secret-detection-report.json
  artifacts:
    paths:
      - secret-detection-report.json
    reports:
      secret_detection: secret-detection-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ============================================
# CODE QUALITY STAGE
# ============================================

# Code Quality (using GitLab template)
# Override to set correct stage (template defaults to 'test' stage)
code_quality:
  stage: code_quality
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ============================================
# ANALYZE REPORTS STAGE
# ============================================

# This job uses the analyze_reports.sh script from the GitLab repo
# The script is project-specific, so it stays in the GitLab repo
analyze_reports:
  stage: analyze
  image: alpine:latest
  before_script:
    - apk add --no-cache jq bash
  script:
    - bash ./scripts/analyze_reports.sh
  dependencies:
    - semgrep-sast
    - secret_detection
  artifacts:
    paths:
      - security-analysis-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: false

# ============================================
# DEPLOY STAGE (Example)
# ============================================

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deployment would happen here"
    - echo "Deploying to environment: $CI_ENVIRONMENT_NAME"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  when: manual

